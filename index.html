<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 1. Favicon diubah ke logo Mahreen -->
    <link rel="icon" type="image/png" href="src/assets/favicon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahreen – Berkarya Untuk Indonesia</title>
    
    <!-- 2. Google Fonts dirapikan agar tidak duplikat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    
    <!-- Script penahan flash tema bawaanmu (dipertahankan karena strukturnya bagus) -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
